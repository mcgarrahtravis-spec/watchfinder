services:
  - type: web
    name: watchfinder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn watchfinder.web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: WATCHFINDER_CONFIG
        value: /opt/render/project/src/config.demo.yaml
healthCheckPath: /health
