# Demo-friendly defaults for hosted deploys.
queries:
  - Rolex Submariner
  - Omega Speedmaster
  - Tudor Black Bay
  - Seiko SKX

sources:
  hibid: false
  catawiki: false
  liveauctioneers: false
  csv_path: watchfinder/data/demo_lots.json

comps:
  use_reference: true
  use_ebay: false
  use_chrono24: false
  max_comps_per_query: 8

deal:
  min_margin_pct: 0.18
  buyer_premium_pct:
    hibid: 0.15
    catawiki: 0.12
    liveauctioneers: 0.20
    csv: 0.15
  estimated_shipping_usd: 35
  currency: USD

rate_limit_seconds: 1.0
max_lots_per_source: 40

filters:
  max_hours_until_end: 24
  require_end_time: true
  reject_stock_photos: true
  hibid_stock_threshold: 3.0
  other_stock_threshold: 5.0
  reject_hibid_without_photo: true
